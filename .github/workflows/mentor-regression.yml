name: Mentor and learner regression checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '30 2 * * *'
permissions:
  contents: read
jobs:
  synthetic-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Reject production security advisories at high severity
        run: pnpm audit --prod --audit-level high
      - name: Reject all advisories across the complete dependency tree
        run: pnpm audit --audit-level low
      - run: node scripts/mentor-regression.cjs
      - name: Billing launch gate and existing-customer management (synthetic only)
        run: |
          node tests/billing-setup.cjs
          node tests/billing.cjs
          node --test tests/membership-management.cjs tests/membership-management-ui.cjs tests/policy-readiness.cjs tests/billing-provider-retries.cjs tests/membership-dialog.test.cjs tests/checkout-visibility.cjs tests/billing-paused.cjs tests/style-account-safety.cjs tests/mentor-view-lifecycle.cjs tests/mentor-answer-repair.cjs
      - run: node scripts/verify-migrations.cjs
      - run: pnpm exec tsc --noEmit
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: services/project-sandbox
      - run: npm audit --audit-level low
        working-directory: services/project-sandbox
      - run: node --test tests/sandbox-service.test.mjs
