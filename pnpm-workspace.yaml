# Copied Sites are standalone projects and cannot inherit the monorepo policy.
minimumReleaseAge: 10080
minimumReleaseAgeIgnoreMissingTime: false
trustLockfile: false
strictDepBuilds: true
allowBuilds:
  esbuild: true
  fsevents: true
  sharp: true
  unrs-resolver: true
  workerd: true
storeDir: ${SITES_PNPM_SHARED_STORE:-.sites-runtime/pnpm-store}
cacheDir: ${SITES_PNPM_SHARED_STORE:-.sites-runtime/pnpm-store}/policy-cache
enableGlobalVirtualStore: false
# A later project-only session must not mutate a shared-store inode through node_modules.
packageImportMethod: clone-or-copy
# The explicit installer owns dependency setup, including restored workspaces.
verifyDepsBeforeRun: false
optimisticRepeatInstall: false
overrides:
  'fast-glob@>=3.0.0 <4.0.0': 3.3.3
  'fast-glob@3.3.3>micromatch': '-'
  miniflare>sharp: 0.35.5
  # Patched floors for the 2026-10-23 advisory review; keep the release-age policy above.
  'esbuild@<0.28.1': 0.28.1
  'ws@>=8.0.0 <8.21.0': 8.21.0
  'undici@>=7.0.0 <7.29.1': 7.29.1
  'js-yaml@>=4.0.0 <4.3.2': 4.3.2
  '@babel/core@>=7.0.0 <7.29.6': 7.29.6
  'brace-expansion@>=1.0.0 <1.1.21': 1.1.21
  'brace-expansion@>=5.0.0 <5.0.12': 5.0.12
  'browserslist@>=4.0.0 <4.28.7': 4.28.7
  'fflate@>=0.7.0 <0.7.5': 0.7.5
  'baseline-browser-mapping@<2.11.0': 2.11.0
  'image-size@>=2.0.0 <2.0.3': 2.0.3
  'fast-uri@>=3.0.0 <3.1.8': 3.1.8
  'source-map-js@>=1.0.0 <1.2.2': 1.2.2
  'sharp@<0.35.5': 0.35.5
patchedDependencies:
  fast-glob@3.3.3: patches/fast-glob@3.3.3.patch

# The source patch above replaces the former matcher dependency with these APIs.
packageExtensions:
  fast-glob@3.3.3:
    dependencies:
      picomatch: 2.3.2
      brace-expansion: 5.0.12
